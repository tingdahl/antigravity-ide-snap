name: antigravity-ide-snap
version: '0+unknown'
summary: Google Antigravity IDE — agent-first coding environment.
icon: snap/gui/antigravity-ide.png
description: |
  Antigravity IDE is Google's agentic development environment built on top of
  the VS Code / Electron platform. It lets you plan, build, debug and ship
  software with autonomous AI agents working directly in your codebase.

  This snap repackages the official upstream Linux build (the
  "Antigravity IDE.tar.gz" archive published by Google) into a self-contained
  snap.

license: Proprietary
grade: stable
confinement: strict
base: core24
compression: lzo
adopt-info: antigravity-ide

# Build-time fetch downloads the matching IDE tarball into this part source.
# To also build arm64, add the corresponding "linux-arm" URL and a matching
# build-for entry.
platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]

parts:
  antigravity-ide:
    plugin: dump
    source: ./upstream
    override-pull: |
      set -eux

      if [[ -n "${ANTIGRAVITY_IDE_VERSION:-}" && -n "${ANTIGRAVITY_IDE_EXECUTION_ID:-}" ]]; then
        VERSION="$ANTIGRAVITY_IDE_VERSION"
        EXECUTION_ID="$ANTIGRAVITY_IDE_EXECUTION_ID"
      elif [[ -f "$CRAFT_PROJECT_DIR/UPSTREAM_VERSION" ]]; then
        VERSION="$(tr -d '[:space:]' < "$CRAFT_PROJECT_DIR/UPSTREAM_VERSION")"
        EXECUTION_ID="$(curl -fsSL "https://antigravity-ide-auto-updater-974169037036.us-central1.run.app/releases" | python3 -c 'import json, sys; version = sys.argv[1]; releases = json.load(sys.stdin); matches = [r for r in releases if str(r.get("version", "")) == version]; assert matches, f"No execution_id found for version {version}"; print(matches[0]["execution_id"])' "$VERSION")"
      else
        read -r VERSION EXECUTION_ID <<<"$(curl -fsSL "https://antigravity-ide-auto-updater-974169037036.us-central1.run.app/releases" | python3 -c 'import json, re, sys; releases = json.load(sys.stdin); semver = lambda v: tuple(([int(x) for x in re.findall(r"\d+", str(v))] + [0, 0, 0])[:3]); best = max(releases, key=lambda r: semver(r.get("version", "0.0.0"))); print(best["version"], best["execution_id"])')"
      fi

      craftctl set version="$VERSION"

      case "$CRAFT_ARCH_BUILD_FOR" in
        amd64)
          URL="https://edgedl.me.gvt1.com/edgedl/release2/j0qc3/antigravity/stable/${VERSION}-${EXECUTION_ID}/linux-x64/Antigravity%20IDE.tar.gz"
          ;;
        arm64)
          URL="https://edgedl.me.gvt1.com/edgedl/release2/j0qc3/antigravity/stable/${VERSION}-${EXECUTION_ID}/linux-arm/Antigravity%20IDE.tar.gz"
          ;;
        *)
          echo "Unsupported architecture: $CRAFT_ARCH_BUILD_FOR"
          exit 1
          ;;
      esac
      curl --fail --location --silent --show-error \
        --retry 8 --retry-all-errors --retry-delay 2 \
        --connect-timeout 20 --max-time 900 \
        -o "$CRAFT_PART_SRC/antigravity-ide-build.tar.gz" "$URL"
    # Auto-patch the ELF interpreter and rpath of the bundled Electron binary
    # and its shared libraries so they resolve against the base + staged libs.
    build-attributes:
      - enable-patchelf
    override-build: |
      set -eux
      APPDIR="$CRAFT_PART_INSTALL/usr/share/antigravity-ide"
      mkdir -p "$APPDIR"
      # Strip the leading "Antigravity IDE/" directory from the archive.
      tar -xzf "$CRAFT_PART_SRC/antigravity-ide-build.tar.gz" \
        -C "$APPDIR" --strip-components=1
      # The chrome-sandbox helper is unused (we launch with --no-sandbox),
      # drop its setuid bit so the snap packs cleanly.
      if [ -f "$APPDIR/chrome-sandbox" ]; then
        chmod 0755 "$APPDIR/chrome-sandbox"
      fi
    build-packages:
      - curl
    # The gnome extension provides the GTK3/gdk-pixbuf/mesa/glib/icon/theme
    # stack via the gnome-46-2404 platform snap, so only app-specific runtime
    # libraries are staged here.
    stage-packages:
      - ca-certificates
      - libcurl4
      - libnss3
      - libsecret-1-0
      - libxkbfile1
      - git
      - openssh-client
    prime:
      - -usr/share/doc
      - -usr/share/fonts
      - -usr/share/lintian
      - -usr/share/man

  launcher:
    plugin: dump
    source: ./scripts
    organize:
      antigravity-ide-launch: bin/antigravity-ide-launch
    after:
      - antigravity-ide

apps:
  antigravity-ide:
    command: bin/antigravity-ide-launch
    common-id: antigravity-ide.desktop
    extensions:
      - gnome
    plugs:
      - audio-playback
      - gpg-keys
      - home
      - network
      - network-bind
      - mount-observe
      - password-manager-service
      - removable-media
      - ssh-keys

  url-handler:
    command: bin/antigravity-ide-launch --open-url
    extensions:
      - gnome
    plugs:
      - home
      - network
      - network-bind
      - mount-observe
      - password-manager-service
      - removable-media
      - ssh-keys
